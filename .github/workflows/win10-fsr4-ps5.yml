name: Veyra 2.2.1 - Windows 10 FSR4 and PS5

on:
  push:
    branches: [win10-fsr4-ps5-2.2.1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: win10-ps5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      VCPKG_MAX_CONCURRENCY: '2'
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Python build tooling and helper tests
        run: |
          python -m pip install protobuf==5.29.5 pefile==2024.8.26
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B scripts/ci/test_win10_ps5.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Restore dependency cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: dependencies
        with:
          path: |
            .ci-work/vcpkg/installed
            .ci-work/vcpkg/downloads
            .ci-work/downloads
            .ci-work/cargo-tools
          key: win10-ps5-windows2022-v1-${{ hashFiles('scripts/ci/win10-ps5-lock.json', 'scripts/ci/build-win10-ps5.ps1') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            win10-ps5-windows2022-v1-${{ hashFiles('scripts/ci/win10-ps5-lock.json', 'scripts/ci/build-win10-ps5.ps1') }}-
            win10-ps5-windows2022-v1-
      - name: Build static dependency libraries
        timeout-minutes: 15
        run: ./scripts/ci/build-win10-ps5.ps1 -Phase vcpkg
      - name: Build Xbox dependency libraries
        timeout-minutes: 15
        run: ./scripts/ci/build-win10-ps5.ps1 -Phase libraries
      - name: Install pinned C header generator
        timeout-minutes: 15
        run: |
          $tool = "$env:GITHUB_WORKSPACE/.ci-work/cargo-tools/bin/cbindgen.exe"
          if (-not (Test-Path $tool)) {
            cargo install cbindgen --version 0.29.2 --locked --jobs 2 --root "$env:GITHUB_WORKSPACE/.ci-work/cargo-tools"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          "$env:GITHUB_WORKSPACE/.ci-work/cargo-tools/bin" >> $env:GITHUB_PATH
      - name: Fetch verified donor and pinned SDK sources
        timeout-minutes: 15
        run: python -B scripts/ci/prepare-win10-ps5.py sources --work .ci-work
      - name: Save dependency cache before building the application
        if: always() && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .ci-work/vcpkg/installed
            .ci-work/vcpkg/downloads
            .ci-work/downloads
            .ci-work/cargo-tools
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Prepare matching FFmpeg and Dolby Vision development prefixes
        timeout-minutes: 15
        run: python -B scripts/ci/prepare-win10-ps5.py headers --work .ci-work
      - name: Build AMD optical flow SDK
        timeout-minutes: 15
        run: ./scripts/ci/build-win10-ps5.ps1 -Phase sdk
      - name: Build pinned static SDL3 controller support
        timeout-minutes: 15
        run: ./scripts/ci/build-win10-ps5.ps1 -Phase sdl
      - name: Verify patched Chiaki and run native initialization gate
        timeout-minutes: 15
        run: ./scripts/ci/build-win10-ps5.ps1 -Phase native
      - name: Configure combined application
        run: ./scripts/ci/build-win10-ps5.ps1 -Phase configure
      - name: Compile application and offline test targets
        timeout-minutes: 15
        run: ./scripts/ci/build-win10-ps5.ps1 -Phase build
      - name: Offline PS5 protocol tests (no console or credentials)
        timeout-minutes: 5
        run: ./scripts/ci/build-win10-ps5.ps1 -Phase test
      - name: Package matching executable, interface, shaders and Agility runtime
        timeout-minutes: 5
        run: ./scripts/ci/build-win10-ps5.ps1 -Phase package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: veyra-2.2.1-win10-fsr4-ps5-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-diagnostics-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .ci-work/build/CMakeCache.txt
            .ci-work/build/CMakeFiles/CMakeConfigureLog.yaml
            .ci-work/build/Testing/Temporary/LastTest.log
            .ci-work/native-build/CMakeCache.txt
            .ci-work/native-build/CMakeFiles/CMakeConfigureLog.yaml
            .ci-work/native-build/Testing/Temporary/LastTest.log
            .ci-work/sdl-build/CMakeCache.txt
            .ci-work/ffx1/sdk/build/CMakeCache.txt
            .ci-work/ffmpeg/ffmpeg-patched/ffbuild/config.log
            .ci-work/vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore
          retention-days: 7
